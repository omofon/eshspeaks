  <rect x="12" y="33" width="22" height="5" fill="#C9541F"/>
  <rect x="12" y="43" width="30" height="5" fill="#F5F1E8"/>
  <!-- Spine -->
  <rect x="12" y="23" width="5" height="25" fill="#F5F1E8"/>
  <!-- Premium accent dot -->
  <circle cx="48" cy="45" r="4" fill="#D9A441"/>
</svg>
